curriculum:
  enabled: true
  warmup_ratio: 0.3
data:
  dataset: lcsts
  max_eval_samples: 200
  max_test_samples: 200
  max_train_samples: 2000
dpo:
  batch_size: 8
  beta: 0.1
  gradient_accumulation: 2
  learning_rate: 5.0e-06
  loss_type: sigmoid
  max_length: 256
  max_prompt_length: 128
  num_epochs: 3
feedback:
  min_score_diff: 0.0
  model:
    enabled: false
    model_name: models/Qwen2.5-0.5B-Instruct
  num_candidates: 4
  rule:
    enabled: true
    metrics:
    - rouge1
    - rouge2
    - rougeL
    weights:
      rouge1: 0.3
      rouge2: 0.3
      rougeL: 0.4
generation:
  max_new_tokens: 128
  multi_temperature: true
  temperature: 1.2
  top_p: 0.95
lora:
  alpha: 16
  dropout: 0.05
  r: 8
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
model:
  dtype: float16
  name: models/Qwen2.5-1.5B-Instruct
  trust_remote_code: true
output:
  dir: outputs/mfrl_v3
  logging_steps: 10
  save_strategy: epoch
